# CI por PR do nekkora-rpa (NEKKORA-PACKAGING-001). NÃO publica nada: só constrói, verifica e testa.
# Actions fixadas por SHA de commit (a tag fica no comentário).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: qualidade (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Ambiente de desenvolvimento (versões homologadas)
        run: python -m pip install -e ".[dev]" -c constraints/dev.txt
      - name: Chromium do Playwright (testes de navegador, headless)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then python -m playwright install --with-deps chromium; else python -m playwright install chromium; fi
      - name: ruff check
        run: python -m ruff check .
      - name: ruff format --check
        run: python -m ruff format --check src tests tools lab examples  # os .md ficam como estão
      - name: mypy --strict
        run: python -m mypy
      - name: Testes (unidade, contrato, integração com Chromium e ponta a ponta com o wheel)
        # "chrome" exige o Google Chrome instalado com janela: roda só na homologação local (ver docs/test-plan.md)
        run: python -m pytest -m "not chrome" -ra --junitxml=pytest-${{ matrix.os }}.xml
      - name: Resultado dos testes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pytest-${{ matrix.os }}
          path: pytest-${{ matrix.os }}.xml
          retention-days: 14

  distribuicao:
    name: distribuição (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # SOURCE_DATE_EPOCH = data do commit (construção reprodutível)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Ferramentas de construção travadas por hash
        run: python -m pip install --require-hashes --only-binary=:all: -r constraints/build.lock
      - name: Construir e verificar wheel + sdist (conteúdo, metadados, instalação limpa de cada um)
        run: python tools/verificar_distribuicao.py --sem-isolamento --saida verificacao
      - name: twine check
        run: |
          python -m pip install "twine==7.0.0"
          python -m twine check --strict verificacao/dist/*
      - name: SHA-256 dos artefatos
        shell: bash
        run: cd verificacao/dist && sha256sum * | tee ../SHA256SUMS
      - name: Artefatos verificados (somente CI — nada é publicado)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: distribuicao-${{ matrix.os }}
          path: |
            verificacao/dist/
            verificacao/SHA256SUMS
            verificacao/verificacao-distribuicao.json
          retention-days: 14

<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Adversarial — resolver e ações</title>
<link rel="stylesheet" href="/lab.css"><header>Cenários adversariais (fictício)</header>
<main><h1 id="titulo-adv">Cenários adversariais</h1>

<section aria-label="Únicos"><button id="salvar" type="button">Salvar</button>
  <button id="contador" type="button">Contar</button>
  <span id="cliques" role="status">0</span> <span id="duplos" role="status">0</span></section>

<section aria-label="Duplicados">
  <button data-testid="duplicado" type="button">Duplicado</button>
  <button data-testid="duplicado" type="button">Duplicado</button></section>

<section aria-label="Sósias">
  <form id="form-a" onsubmit="return false"><button id="enviar-real" type="button">Enviar</button></form>
  <form id="form-b" onsubmit="return false"><button class="enviar" type="button">Enviar</button></form></section>

<section aria-label="Identidade">
  <button id="excluir" type="button">Cancelar</button>
  <a id="link-falso" href="#">Salvar link</a></section>

<section aria-label="Campos">
  <label for="campo-texto">Nome</label><input id="campo-texto" name="nome" autocomplete="off">
  <label for="campo-ro">Somente leitura</label><input id="campo-ro" readonly value="fixo">
  <label for="campo-desab">Desabilitado</label><input id="campo-desab" disabled>
  <label for="campo-maiusculo">Maiúsculo</label><input id="campo-maiusculo" autocomplete="off">
  <label for="campo-senha">Senha de teste</label><input id="campo-senha" type="password" autocomplete="off"></section>

<section aria-label="Tempo">
  <div id="area-tardio"></div>
  <button id="habilita" type="button" disabled>Habilita</button>
  <button id="sempre-desab" type="button" disabled>Nunca habilita</button></section>

<section aria-label="Cobertos" style="position:relative">
  <div style="position:relative;display:inline-block">
    <button id="coberto" type="button">Coberto</button>
    <div style="position:absolute;inset:0;background:rgba(0,0,0,.2)"></div></div>
  <div style="position:relative;display:inline-block">
    <button id="coberto-temp" type="button">Coberto por instantes</button>
    <div id="capa-temp" style="position:absolute;inset:0;background:rgba(0,0,0,.2)"></div></div></section>

<section aria-label="Escopos">
  <div id="host"></div>
  <iframe id="quadro" src="/adversarial/frame.html" title="Quadro" style="height:70px"></iframe></section>

<section aria-label="Navegação">
  <a id="nova-aba" href="/adversarial/destino.html" target="_blank">Abrir nova aba</a>
  <a id="mudar-rota" href="/adversarial/destino.html">Mudar rota</a>
  <a id="link-redir" href="/redir/externo">Redirecionar</a>
  <button id="ir-externo" type="button">Ir para externo</button>
  <a id="nova-aba-externa" href="#" target="_blank">Abrir externo em nova aba</a></section>

<section aria-label="Efeito e queda">
  <button id="fecha" type="button">Registrar e fechar</button>
  <button id="efeito-lento" type="button">Registrar devagar</button></section>
</main>
<script>
window.__lab = {cliques: 0, duplos: 0, salvar: 0, enviarReal: 0, enviarSosia: 0, excluir: 0, coberto: 0, cobertoTemp: 0, habilita: 0, tardio: 0};
const $ = id => document.getElementById(id);
$('salvar').addEventListener('click', () => window.__lab.salvar++);
$('contador').addEventListener('click', () => { window.__lab.cliques++; $('cliques').textContent = window.__lab.cliques; });
$('contador').addEventListener('dblclick', () => { window.__lab.duplos++; $('duplos').textContent = window.__lab.duplos; });
$('enviar-real').addEventListener('click', () => window.__lab.enviarReal++);
document.querySelector('.enviar').addEventListener('click', () => window.__lab.enviarSosia++);
$('excluir').addEventListener('click', () => window.__lab.excluir++);
$('coberto').addEventListener('click', () => window.__lab.coberto++);
$('coberto-temp').addEventListener('click', () => window.__lab.cobertoTemp++);
$('habilita').addEventListener('click', () => window.__lab.habilita++);
$('campo-maiusculo').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase(); });
const p = new URLSearchParams(location.search);
const ext = p.get('externo');
$('ir-externo').addEventListener('click', () => { if (ext) location.href = ext + '/js'; });
if (ext) $('nova-aba-externa').href = ext + '/aba';
setTimeout(() => { const b = document.createElement('button'); b.id = 'tardio'; b.type = 'button'; b.textContent = 'Tardio';
  b.addEventListener('click', () => window.__lab.tardio++); $('area-tardio').appendChild(b); }, Number(p.get('tardio') || 800));
setTimeout(() => { $('habilita').disabled = false; }, Number(p.get('habilita') || 1000));
setTimeout(() => { $('capa-temp').remove(); }, Number(p.get('capa') || 700));
$('fecha').addEventListener('mousedown', () => {
  // o efeito é registrado de forma síncrona na janela que abriu este pop-up (mesma origem), antes de fechar
  try { if (window.opener) window.opener.__efeitos = (window.opener.__efeitos || 0) + 1; } catch (e) {}
  window.close(); });
$('efeito-lento').addEventListener('click', () => { fetch('/api/lab/efeito?botao=lento', {keepalive: true}); });
const sombra = $('host').attachShadow({mode: 'open'});
sombra.innerHTML = '<button id="sombra" type="button">Sombra</button>';
</script></html>

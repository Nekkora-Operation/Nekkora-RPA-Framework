<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Pedidos — Por referência</title>
<link rel="stylesheet" href="/lab.css"><header>Pedidos (fictício) <a href="/pedidos/novo.html" id="ir-novo">Novo pedido</a></header>
<main><h1 id="titulo-lista">Pedidos por referência</h1>
<label for="busca-ref">Referência</label><input id="busca-ref" autocomplete="off">
<div><button id="buscar" type="button">Buscar</button></div>
<p id="buscando" class="oculto">Buscando…</p>
<section id="lista-resultado" class="oculto" aria-label="Pedidos encontrados">
  <p>Pedidos: <span id="lista-total"></span></p><ul id="lista-protocolos"></ul></section>
<p id="lista-vazia" class="oculto" role="status">Nenhum pedido para esta referência</p>
<p id="lista-erro" class="erro oculto" role="alert">Serviço indisponível</p>
</main>
<script>
const $ = id => document.getElementById(id);
$('buscar').addEventListener('click', async () => {
  ['lista-resultado', 'lista-vazia', 'lista-erro'].forEach(i => $(i).classList.add('oculto'));
  $('buscando').classList.remove('oculto');
  let fim = 'lista-erro';
  try {
    const r = await fetch('/api/pedidos/por-referencia?ref=' + encodeURIComponent($('busca-ref').value.trim()));
    if (r.ok) {
      const d = await r.json();
      if (d.pedidos.length) {
        fim = 'lista-resultado';
        $('lista-total').textContent = String(d.pedidos.length);
        $('lista-protocolos').innerHTML = '';
        d.pedidos.forEach(p => { const li = document.createElement('li'); li.textContent = p.protocolo;
                                 $('lista-protocolos').appendChild(li); });
      } else fim = 'lista-vazia';
    }
  } catch (e) { fim = 'lista-erro'; }
  $('buscando').classList.add('oculto');
  $(fim).classList.remove('oculto');
});
</script></html>
